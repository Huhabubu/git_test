name: Shidian Generic EPUB test

on:
  push:
    branches:
      - feat/shidian-epub-test
    paths:
      - 'shidian_epub/**'
      - '.github/workflows/shidian-ming-taizu-epub.yml'
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r shidian_epub/requirements.txt

      - name: Restore chapter cache
        uses: actions/cache/restore@v4
        with:
          path: shidian_epub/cache/LS0026
          key: shidian-ls0026-${{ github.run_id }}
          restore-keys: |
            shidian-ls0026-

      - name: Auto-detect group and build EPUB
        run: |
          mkdir -p shidian_epub/out
          python shidian_epub/shidian_to_epub.py \
            'https://www.shidianguji.com/book/LS0026/chapter/1k7geysfcta1x' \
            -o 'shidian_epub/out/明太祖实录.epub' \
            --cache-dir 'shidian_epub/cache' \
            --workers 2 \
            --attempts 6 \
            --min-interval 0.45

      - name: Verify generic auto selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('shidian_epub/out/明太祖实录.report.json')
          assert p.exists(), 'report 不存在'
          d = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
              'book_id': d.get('book_id'),
              'book_name': d.get('book_name'),
              'selection_mode': d.get('selection_mode'),
              'group_index': d.get('group_index'),
              'group_name': d.get('group_name'),
              'catalog_count': d.get('catalog_count'),
              'selected_count': d.get('selected_count'),
              'pages': d.get('pages'),
              'total_chars': d.get('total_chars'),
              'failures': len(d.get('failures', [])),
              'duplicates': len(d.get('duplicates', [])),
          }, ensure_ascii=False, indent=2))
          print('first:', d.get('selected_first'))
          print('last :', d.get('selected_last'))

          assert d['book_id'] == 'LS0026'
          assert d['selection_mode'] == 'chapter_group'
          assert d['group_index'] == 1
          assert d['group_name'] == '太祖高皇帝實錄'
          assert d['selected_count'] == 263, d['selected_count']
          assert d['pages'] == 263, d['pages']
          assert not d['failures'], d['failures'][:3]
          assert d['selected_first']['chapter_id'] == '1k6qotvc8abea'
          assert d['selected_last']['chapter_id'] == '1k6q57cmiw2sy'
          assert d['total_chars'] > 1_000_000

          epub = Path('shidian_epub/out/明太祖实录.epub')
          assert epub.exists()
          assert epub.stat().st_size > 1_000_000
          PY

      - name: Save chapter cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: shidian_epub/cache/LS0026
          key: shidian-ls0026-${{ github.run_id }}

      - name: Upload EPUB and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shidian-generic-epub
          path: |
            shidian_epub/out/
            shidian_epub/cache/LS0026/debug/
          if-no-files-found: warn
          retention-days: 7
